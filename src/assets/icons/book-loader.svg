<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 80" width="100" height="80" role="img" aria-label="Loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .page {
      transform-origin: 50px 0;
      animation: flip 1.8s ease-in-out infinite;
    }
    .page path.sheet { animation: shade 1.8s ease-in-out infinite; }
    .page:nth-of-type(2), .page:nth-of-type(2) path.sheet { animation-delay: 0.3s; }
    .page:nth-of-type(3), .page:nth-of-type(3) path.sheet { animation-delay: 0.6s; }

    @keyframes flip {
      0%, 10%   { transform: scaleX(1);  opacity: 1; }
      60%, 85%  { transform: scaleX(-1); opacity: 1; }
      100%      { transform: scaleX(-1); opacity: 0; }
    }
    @keyframes shade {
      0%, 10%   { fill: #dcaa6c; }
      35%       { fill: #a8763f; }
      60%, 100% { fill: #dcaa6c; }
    }
    @media (prefers-reduced-motion: reduce) {
      .page, .page path.sheet { animation: none; opacity: 0; }
    }
  </style>

  <defs>
    <!-- vertical wood grain, same feel as the app background -->
    <pattern id="grain" width="4" height="80" patternUnits="userSpaceOnUse">
      <rect width="4" height="80" fill="#b07d4a"/>
      <rect x="0" width="1" height="80" fill="#000" opacity="0.07"/>
      <rect x="2.5" width="0.5" height="80" fill="#fff" opacity="0.05"/>
    </pattern>
    <g id="lines">
      <path d="M57 32 H76 M57 38 H76 M57 44 H72 M57 50 H76" stroke="#7b5a36" stroke-width="1.4" stroke-linecap="round" opacity="0.35"/>
    </g>
  </defs>

  <!-- soft shadow -->
  <ellipse cx="50" cy="70" rx="38" ry="4" fill="#000" opacity="0.25"/>

  <!-- cover -->
  <rect x="10" y="20" width="80" height="48" rx="6" fill="url(#grain)"/>
  <rect x="10" y="20" width="80" height="48" rx="6" fill="none" stroke="#6b4a2a" stroke-width="1.5"/>

  <!-- static pages -->
  <path d="M50 24 Q34 20 16 24 L16 63 Q34 59 50 63 Z" fill="#dcaa6c"/>
  <path d="M50 24 Q66 20 84 24 L84 63 Q66 59 50 63 Z" fill="#dcaa6c"/>
  <use href="#lines"/>
  <use href="#lines" transform="translate(100 0) scale(-1 1)"/>

  <!-- flipping pages -->
  <g class="page"><path class="sheet" d="M50 24 Q66 20 84 24 L84 63 Q66 59 50 63 Z"/><use href="#lines"/></g>
  <g class="page"><path class="sheet" d="M50 24 Q66 20 84 24 L84 63 Q66 59 50 63 Z"/><use href="#lines"/></g>
  <g class="page"><path class="sheet" d="M50 24 Q66 20 84 24 L84 63 Q66 59 50 63 Z"/><use href="#lines"/></g>

  <!-- spine, matching the card's divider -->
  <line x1="50" y1="23" x2="50" y2="64" stroke="#6b4a2a" stroke-width="1.8" stroke-linecap="round"/>
</svg>
